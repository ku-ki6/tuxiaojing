name: 编译 图小净 iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 生成 iOS 工程
        run: npx cap add ios

      - name: 同步网页资源与插件
        run: npx cap sync ios

      - name: 写入相册权限说明（必须，否则一调用就崩溃）
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 图小净需要访问你的相册，用于识别重复、模糊与截图照片" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 图小净需要访问你的相册，用于识别重复、模糊与截图照片" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 图小净需要写入相册以删除你标记的照片" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 图小净需要写入相册以删除你标记的照片" "$PLIST"

      - name: 安装 CocoaPods 依赖
        run: |
          cd ios/App
          pod install --repo-update

      - name: 查看可用目标（排错用）
        run: |
          cd ios/App
          xcodebuild -version || true
          xcodebuild -workspace App.xcworkspace -scheme App -showdestinations || true

      - name: 编译（先试 archive，失败自动改用 build 兜底）
        run: |
          set -o pipefail
          cd ios/App
          FLAGS='CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO ENABLE_USER_SCRIPT_SANDBOXING=NO ONLY_ACTIVE_ARCH=YES ARCHS=arm64 IPHONEOS_DEPLOYMENT_TARGET=13.0'
          if ! eval "xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive $FLAGS" 2>&1 | tee /tmp/build.log; then
            echo "=== archive 方式失败，改用 build 方式重试（产物同样可以打包成 IPA）==="
            eval "xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/DD build $FLAGS" 2>&1 | tee -a /tmp/build.log
          fi

      - name: 上传编译日志（排错用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 编译日志
          path: /tmp/build.log
          retention-days: 7

      - name: 打印编译错误（失败时用，方便看原因）
        if: failure()
        run: |
          echo "===== 编译日志中的错误行 ====="
          grep -nE "error:|Error |FAILED|clang:|ld:|PhaseScriptExecution|Command failed|CodeSign" /tmp/build.log | tail -60
          echo ""
          echo "===== 日志最后 40 行 ====="
          tail -40 /tmp/build.log

      - name: 打包成 IPA
        run: |
          set -e
          cd ios/App
          APP_PATH=$(find build -maxdepth 6 -name "App.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::没有找到 App.app，下面是编译日志最后 150 行，真正原因就在这里："
            tail -150 /tmp/build.log
            exit 1
          fi
          echo "找到产物：$APP_PATH"
          rm -rf /tmp/Payload && mkdir -p /tmp/Payload
          cp -r "$APP_PATH" /tmp/Payload/
          cd /tmp && zip -qr "$GITHUB_WORKSPACE/图小净.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/图小净.ipa"

      - name: 上传 IPA（在 Actions 页面下载）
        uses: actions/upload-artifact@v4
        with:
          name: 图小净-IPA
          path: 图小净.ipa
          retention-days: 30
